envVarGroups:
  - name: gestion-personnel-production
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "false"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@entreprise.fr
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FORCE_HTTPS
        value: "true"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: RATELIMIT_ENABLED
        value: "true"
      - key: REQUIRE_REDIS_RATE_LIMIT
        value: "true"
      - key: LOGIN_RATE_LIMIT
        value: 5 per minute;20 per hour
      # S3 est prêt dans le code, mais reste désactivé tant qu'aucun bucket
      # privé n'a été créé. Les fichiers continuent donc à vivre en BYTEA.
      - key: OBJECT_STORAGE_ENABLED
        value: "false"
      - key: OBJECT_STORAGE_REQUIRED
        value: "false"
      - key: OBJECT_STORAGE_THRESHOLD_BYTES
        value: "1048576"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: EMAIL_ENABLED
        value: "false"

services:
  - type: web
    name: gestion-personnel
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask bootstrap-db && flask db upgrade
    startCommand: >-
      gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
      --timeout 60 --graceful-timeout 30 --max-requests 1000
      --max-requests-jitter 100
    healthCheckPath: /health/ready
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: gestion-personnel-production
      - key: SERVICE_NAME
        value: gestion-personnel-web
      # Seul secret manuel requis pour une base neuve. Il est ignoré si un
      # compte existe déjà et peut ensuite être supprimé du Dashboard Render.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: AUTO_INIT_DB
        value: "false"
      - key: SCHEDULER_MODE
        value: disabled
      - key: REQUIRE_ALEMBIC_CURRENT
        value: "true"
      - key: REQUIRE_SCHEDULER_HEARTBEAT
        value: "false"
      - key: BACKUP_MONITORING_ENABLED
        value: "false"
      - key: REQUIRE_BACKUP_FRESHNESS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-personnel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gestion-personnel-redis
          property: connectionString

  - type: worker
    name: gestion-personnel-scheduler
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler_worker.py
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: gestion-personnel-production
      - key: SERVICE_NAME
        value: gestion-personnel-scheduler
      - key: AUTO_INIT_DB
        value: "false"
      - key: SCHEDULER_MODE
        value: worker
      - key: SCHEDULER_STARTUP_TIMEOUT
        value: "900"
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-personnel-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gestion-personnel-redis
          property: connectionString

  - type: keyvalue
    name: gestion-personnel-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

# Sans S3, les sauvegardes/PITR gérées du plan PostgreSQL Render sont la
# protection active. Dockerfile.backup et les scripts restent prêts pour ajouter
# ultérieurement une copie logique indépendante dans un bucket privé.
databases:
  - name: gestion-personnel-db
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
