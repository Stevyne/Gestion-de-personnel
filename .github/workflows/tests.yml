name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # Un push annule le précédent sur la même branche, sauf sur master où
  # l'historique de chaque exécution doit rester consultable.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pytest:
    name: Suite complète PostgreSQL / Redis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_personnel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_personnel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_personnel_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_personnel_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_ENV: testing
      AUTO_INIT_DB: "true"
      SCHEDULER_MODE: disabled
      RATELIMIT_ENABLED: "false"
      OBJECT_STORAGE_ENABLED: "false"
      EMAIL_ENABLED: "false"
      MAIL_USERNAME: ""
      LOG_FORMAT: text

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-production.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier la compilation
        run: >-
          python -m compileall -q app.py extensions.py scheduler_worker.py
          blueprints services scripts migrations tests

      - name: Vérifier les erreurs Python critiques
        run: >-
          ruff check --select F821,F401,F841,E722 app.py extensions.py
          scheduler_worker.py blueprints services scripts migrations tests

      - name: Vérifier et appliquer les migrations Alembic
        run: |
          flask db upgrade
          flask db current | grep 20260817_objectifs

      - name: Exécuter la suite de tests
        run: pytest -q

      - name: Construire l'image de sauvegarde
        run: docker build -f Dockerfile.backup -t gestion-personnel-backup:test .
