name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  # 14 exécutions push existaient avant l'activation de cette cadence.
  # Le patch qui l'active devient donc le push 1 de la première série.
  PUSH_COUNT_BASELINE: "14"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # Ne jamais annuler le 10e push pendant sa suite complète si un 11e arrive.
  cancel-in-progress: false

jobs:
  cadence:
    name: Cadence des tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_tests: ${{ steps.decision.outputs.run_tests }}
      reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Décider si la suite complète doit être exécutée
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "reason=Pull request ou lancement manuel" >> "$GITHUB_OUTPUT"
            echo "### ✅ Suite complète : pull request ou lancement manuel" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?event=push&branch=master&per_page=1"
          if ! response=$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url"); then
            # En cas d'indisponibilité de l'API, on teste plutôt que de prendre
            # le risque de sauter une validation importante.
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "reason=API GitHub indisponible : exécution de sécurité" >> "$GITHUB_OUTPUT"
            echo "### ⚠️ Suite complète par sécurité (API indisponible)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total=$(printf '%s' "$response" | python -c \
            'import json,sys; print(json.load(sys.stdin)["total_count"])')
          position=$((total - PUSH_COUNT_BASELINE))

          if (( position <= 0 )); then
            run_tests=true
            reason="Compteur incohérent : exécution de sécurité"
          elif (( position % 10 == 0 )); then
            run_tests=true
            reason="Push ${position} : fin d'une série de 10"
          else
            run_tests=false
            remaining=$((10 - (position % 10)))
            reason="Push ${position} : encore ${remaining} avant la suite complète"
          fi

          echo "run_tests=${run_tests}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          if [[ "$run_tests" == "true" ]]; then
            echo "### ✅ ${reason}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏭️ ${reason}" >> "$GITHUB_STEP_SUMMARY"
            echo "La suite reste exécutable à tout moment via **Run workflow**." >> "$GITHUB_STEP_SUMMARY"
          fi

  pytest:
    name: Suite complète PostgreSQL / Redis
    needs: cadence
    if: needs.cadence.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_personnel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_personnel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_personnel_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_personnel_test
      REDIS_URL: redis://localhost:6379/0
      FLASK_ENV: testing
      AUTO_INIT_DB: "true"
      SCHEDULER_MODE: disabled
      RATELIMIT_ENABLED: "false"
      OBJECT_STORAGE_ENABLED: "false"
      EMAIL_ENABLED: "false"
      MAIL_USERNAME: ""
      LOG_FORMAT: text

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-production.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier la compilation
        run: >-
          python -m compileall -q app.py extensions.py scheduler_worker.py
          blueprints services scripts migrations tests

      - name: Vérifier les erreurs Python critiques
        run: >-
          ruff check --select F821,F401,F841 app.py extensions.py
          scheduler_worker.py blueprints services scripts migrations
          tests/test_phase4_production.py

      - name: Vérifier et appliquer les migrations Alembic
        run: |
          flask db upgrade
          flask db current | grep 20260817_objectifs

      - name: Exécuter la suite de tests
        run: pytest -q

      - name: Construire l'image de sauvegarde
        run: docker build -f Dockerfile.backup -t gestion-personnel-backup:test .
