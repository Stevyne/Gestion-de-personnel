name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestion_personnel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestion_personnel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_personnel_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestion_personnel_test
      FLASK_ENV: testing
      RATELIMIT_ENABLED: "false"
      EMAIL_ENABLED: "false"
      MAIL_USERNAME: ""

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier la compilation
        run: python -m compileall -q app.py blueprints services tests

      - name: Exécuter la suite de tests
        run: pytest -q
