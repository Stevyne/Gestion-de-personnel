{% extends 'base.html' %}{% block title %}Nouvelle offre d'emploi{% endblock %}{% block content %}<div class="rc-shell"><section class="rc-card"><div class="rc-card-head"><div><h1>Offre d'emploi</h1><p class="rc-muted">L'offre est créée en brouillon ; sa grille doit totaliser 100 % avant publication.</p></div><a class="rc-btn rc-btn-muted" href="{{ url_for('recrutement.offres') }}">Retour</a></div>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if demande %}<input type="hidden" name="demande_id" value="{{ demande.id }}">{% endif %}<div class="rc-grid">
<div class="rc-field"><label>Titre *</label><input name="titre" required maxlength="200" value="{{ demande.poste if demande else '' }}"></div><div class="rc-field"><label>Poste *</label><input name="poste" required maxlength="150" value="{{ demande.poste if demande else '' }}"></div>
<div class="rc-field"><label>Département *</label><select name="departement_id" required>{% for d in departements %}<option value="{{ d.id }}" {% if demande and demande.departement_id==d.id %}selected{% endif %}>{{ d.nom }}</option>{% endfor %}</select></div>
<div class="rc-field"><label>Type de contrat *</label><select name="type_contrat" required>{% for code,label in types_contrats.items() %}<option value="{{ code }}" {% if demande and demande.type_contrat==code %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="rc-field rc-field-full"><label>Description *</label><textarea name="description" required placeholder="Missions, responsabilités, contexte…"></textarea></div>
<div class="rc-field rc-field-full"><label>Compétences</label><textarea name="competences" placeholder="Une compétence par ligne">{{ demande.competences if demande else '' }}</textarea></div>
<div class="rc-field"><label>Niveau d'expérience</label><input name="niveau_experience" maxlength="100"></div><div class="rc-field"><label>Diplôme requis</label><input name="diplome_requis" maxlength="150"></div>
<div class="rc-field"><label>Localisation</label><input name="localisation" maxlength="180"></div><div class="rc-field"><label>Nombre de postes</label><input type="number" min="1" name="nombre_postes" value="{{ demande.nombre_postes if demande else 1 }}"></div>
<div class="rc-field"><label>Salaire minimum</label><input type="number" min="0" step="0.01" name="salaire_min" value="{{ demande.salaire_min if demande and demande.salaire_min else '' }}"></div><div class="rc-field"><label>Salaire maximum</label><input type="number" min="0" step="0.01" name="salaire_max" value="{{ demande.salaire_max if demande and demande.salaire_max else '' }}"></div>
<div class="rc-field"><label>Date de publication</label><input type="date" name="date_publication"></div><div class="rc-field"><label>Date limite</label><input type="date" name="date_limite"></div>
</div><div class="rc-form-actions"><button class="rc-btn rc-btn-green">Créer le brouillon</button><a class="rc-btn rc-btn-muted" href="{{ url_for('recrutement.offres') }}">Annuler</a></div></form></section></div>{% endblock %}
