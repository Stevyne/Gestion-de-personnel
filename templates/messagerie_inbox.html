{% extends "base.html" %}
{% block extra_styles %}<link rel="stylesheet" href="{{ url_for('static', filename='messagerie.css') }}">{% endblock %}

{% block content %}
<div class="msg-shell msg-shell--inbox">
  {% include "_messagerie_sidebar.html" %}

  <main class="msg-main msg-welcome" aria-label="Bienvenue dans la messagerie">
    <div class="msg-welcome-art" aria-hidden="true">
      <span class="msg-welcome-bubble one"></span>
      <span class="msg-welcome-bubble two"></span>
      <span class="msg-welcome-icon">⚡</span>
    </div>
    <h2>Vos messages</h2>
    <p>Sélectionnez une discussion ou démarrez une nouvelle conversation avec un collègue.</p>
    <a href="{{ url_for('messagerie.messagerie_nouveau') }}" class="msg-primary-action">Nouveau message</a>
  </main>
</div>
<script src="{{ url_for('static', filename='messagerie.js') }}"></script>
{% endblock %}
