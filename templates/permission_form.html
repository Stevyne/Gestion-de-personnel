{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 720px; margin: 0 auto;">
    <div class="card-header">
        <h1>🧾 Nouvelle demande de permission</h1>
    </div>

    <p style="color:#64748b; margin: 0 0 16px;">
        Une permission est <strong>indépendante des congés</strong> et ne déduit
        aucun jour de votre solde de congés.
    </p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label for="employe_id">Employé *</label>
            <select name="employe_id" id="employe_id" class="form-control" required>
                {% for emp in employees %}
                    <option value="{{ emp.id }}">{{ emp.prenom }} {{ emp.nom }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="date_debut">Date de début *</label>
                <input type="date" id="date_debut" name="date_debut" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="date_fin">Date de fin *</label>
                <input type="date" id="date_fin" name="date_fin" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="motif">Motif de la permission *</label>
            <textarea name="motif" id="motif" class="form-control" rows="3"
                      placeholder="Ex : rendez-vous administratif, événement familial, démarche personnelle..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Soumettre la demande</button>
            <a href="{{ url_for('permissions') }}" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
