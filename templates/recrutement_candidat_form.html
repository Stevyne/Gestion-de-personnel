{% extends 'base.html' %}{% block title %}Nouveau candidat{% endblock %}{% block content %}<div class="rc-shell"><section class="rc-card"><div class="rc-card-head"><div><h1>Fiche candidat</h1><p class="rc-muted">Cette fiche ne crée pas d'employé.</p></div><a class="rc-btn rc-btn-muted" href="{{ url_for('recrutement.candidats') }}">Retour</a></div><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="rc-grid">
<div class="rc-field"><label>Nom *</label><input name="nom" required maxlength="100"></div><div class="rc-field"><label>Prénom *</label><input name="prenom" required maxlength="100"></div><div class="rc-field"><label>Email *</label><input type="email" name="email" required maxlength="320"></div><div class="rc-field"><label>Téléphone</label><input name="telephone" maxlength="30"></div><div class="rc-field rc-field-full"><label>Adresse</label><textarea name="adresse"></textarea></div><div class="rc-field"><label>Date de naissance</label><input type="date" name="date_naissance"></div><div class="rc-field"><label>Années d'expérience</label><input type="number" min="0" step="0.5" name="experience_annees" value="0"></div><div class="rc-field rc-field-full"><label>Diplôme</label><input name="diplome" maxlength="200"></div><div class="rc-field rc-field-full"><label>Expérience</label><textarea name="experience" placeholder="Postes, missions, réalisations…"></textarea></div><div class="rc-field rc-field-full"><label>Compétences</label><textarea name="competences" placeholder="Une compétence par ligne"></textarea></div><div class="rc-field"><label>CV (PDF/DOC/DOCX, 8 Mo)</label><input type="file" name="cv" accept=".pdf,.doc,.docx"></div><div class="rc-field"><label>Lettre de motivation</label><input type="file" name="lettre" accept=".pdf,.doc,.docx"></div>
</div><div class="rc-form-actions"><button class="rc-btn rc-btn-green">Créer le candidat</button><a class="rc-btn rc-btn-muted" href="{{ url_for('recrutement.candidats') }}">Annuler</a></div></form></section></div>{% endblock %}
